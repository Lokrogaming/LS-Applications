<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewerbung — LS Elyntara & Projekte</title>
<meta name="description" content="Bewirb dich bei LS Elyntara & Projekte.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#0877F9', light: '#4DA3FF', dim: '#0A3A7A' },
          ink: { 950: '#05070D', 900: '#0A0E17', 800: '#111826', 700: '#1B2333' },
          slate: { 300: '#B4BCCC', 500: '#7B8496' }
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
          body: ['"Inter"', 'sans-serif'],
        }
      }
    }
  }
</script>

<style>
  body { background: #05070D; overflow-x: hidden; }
  #network-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.55; }
  .field-input {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .field-input:focus {
    outline: none;
    border-color: #0877F9;
    box-shadow: 0 0 0 3px rgba(8,119,249,0.18);
    background: rgba(8,119,249,0.04);
  }
  .card-glow {
    box-shadow: 0 0 60px -20px rgba(8,119,249,0.25);
  }
  .eyebrow-line { background: linear-gradient(90deg, transparent, #0877F9, transparent); }
  @keyframes pulse-dot { 0%,100% { opacity:.4; transform:scale(1);} 50% { opacity:1; transform:scale(1.4);} }
  .pulse-dot { animation: pulse-dot 2.4s ease-in-out infinite; }
  @keyframes fade-up { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
  .fade-up { animation: fade-up .7s cubic-bezier(.16,1,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .fade-up, .pulse-dot { animation: none !important; } }
  input[type=checkbox], input[type=radio] { accent-color: #0877F9; }
  ::selection { background: #0877F9; color: #05070D; }
</style>
</head>
<body class="min-h-screen text-white font-body relative">

<canvas id="network-canvas" aria-hidden="true"></canvas>

<main class="relative z-10 min-h-screen flex flex-col items-center px-4 sm:px-6 py-16 sm:py-20">

  <div class="fade-up flex items-center gap-3 mb-6">
    <span class="w-2 h-2 rounded-full bg-brand pulse-dot"></span>
    <p class="font-mono text-xs sm:text-sm tracking-[0.35em] text-brand-light uppercase">Werde Teil des Netzwerks</p>
  </div>

  <h1 id="form-title" class="fade-up font-display font-semibold text-3xl sm:text-5xl text-center leading-tight max-w-2xl">
    Bewerbung
  </h1>
  <p id="form-description" class="fade-up font-body text-slate-300 text-sm sm:text-base text-center max-w-xl mt-4"></p>

  <div class="eyebrow-line w-32 h-px mt-8 mb-10 fade-up"></div>

  <!-- Ladezustand -->
  <div id="loading-state" class="fade-up font-mono text-sm text-slate-500">Formular wird geladen …</div>

  <!-- Fehlerzustand -->
  <div id="error-state" class="hidden fade-up font-mono text-sm text-red-400 max-w-md text-center"></div>

  <!-- Formular -->
  <form id="application-form" class="hidden fade-up w-full max-w-xl bg-ink-900/60 backdrop-blur-sm border border-white/10 rounded-2xl card-glow p-5 sm:p-8 flex flex-col gap-5">
    <!-- Felder werden hier per JS eingefügt -->
    <div id="fields-container" class="flex flex-col gap-5"></div>

    <!-- Honeypot gegen Spam -->
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" id="subject-field" name="_subject" value="Neue Bewerbung — LS Elyntara & Projekte">

    <button type="submit" id="submit-btn" class="mt-2 w-full bg-brand hover:bg-brand-light text-white font-display font-semibold rounded-xl py-3.5 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
      Bewerbung absenden
    </button>
    <p id="submit-error" class="hidden text-red-400 text-sm font-mono text-center"></p>
  </form>

  <!-- Erfolgszustand -->
  <div id="success-state" class="hidden fade-up flex flex-col items-center gap-4 text-center max-w-md">
    <div class="w-14 h-14 rounded-full bg-brand/15 border border-brand/40 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-brand-light" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <p id="success-message" class="font-display text-xl sm:text-2xl font-semibold text-white"></p>
  </div>

  <footer class="fade-up mt-16 flex items-center justify-center gap-2 text-slate-500 text-xs font-mono">
    <span class="w-1.5 h-1.5 rounded-full bg-brand"></span>
    LS Elyntara Network
  </footer>

</main>

<script>
  // ============ Konfiguration ============
  const CONFIG_URL = 'form-config.json';
  const FORMSUBMIT_ENDPOINT = 'https://formsubmit.co/ajax/support@ls-leonsprenger.de';

  const els = {
    title: document.getElementById('form-title'),
    description: document.getElementById('form-description'),
    loading: document.getElementById('loading-state'),
    error: document.getElementById('error-state'),
    form: document.getElementById('application-form'),
    fields: document.getElementById('fields-container'),
    submitBtn: document.getElementById('submit-btn'),
    submitError: document.getElementById('submit-error'),
    success: document.getElementById('success-state'),
    successMessage: document.getElementById('success-message'),
    subjectField: document.getElementById('subject-field'),
  };

  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else e.setAttribute(k, v);
    }
    for (const c of children) e.appendChild(c);
    return e;
  }

  function labelNode(field) {
    return el('label', {
      class: 'block text-sm font-medium text-slate-300 mb-2',
      for: field.id,
      text: field.label + (field.required ? ' *' : '')
    });
  }

  function renderField(field) {
    const wrap = el('div', { class: 'field-group' });

    if (field.type === 'textarea') {
      wrap.appendChild(labelNode(field));
      wrap.appendChild(el('textarea', {
        id: field.id, name: field.id, rows: '4',
        placeholder: field.placeholder || '',
        class: 'field-input w-full rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500 resize-none',
        ...(field.required ? { required: 'required' } : {})
      }));
    } else if (field.type === 'select') {
      wrap.appendChild(labelNode(field));
      const select = el('select', {
        id: field.id, name: field.id,
        class: 'field-input w-full rounded-lg px-4 py-3 text-sm text-white',
        ...(field.required ? { required: 'required' } : {})
      });
      select.appendChild(el('option', { value: '', text: 'Bitte wählen …' }));
      (field.options || []).forEach(opt => {
        select.appendChild(el('option', { value: opt, text: opt }));
      });
      wrap.appendChild(select);
    } else if (field.type === 'radio') {
      wrap.appendChild(el('span', { class: 'block text-sm font-medium text-slate-300 mb-2', text: field.label + (field.required ? ' *' : '') }));
      const group = el('div', { class: 'flex flex-wrap gap-2' });
      (field.options || []).forEach((opt, i) => {
        const optId = `${field.id}_${i}`;
        const optWrap = el('label', { for: optId, class: 'field-input flex items-center gap-2 rounded-lg px-3.5 py-2.5 text-sm text-slate-300 cursor-pointer' });
        optWrap.appendChild(el('input', {
          type: 'radio', id: optId, name: field.id, value: opt,
          ...(field.required ? { required: 'required' } : {})
        }));
        optWrap.appendChild(document.createTextNode(opt));
        group.appendChild(optWrap);
      });
      wrap.appendChild(group);
    } else if (field.type === 'checkbox') {
      wrap.appendChild(el('span', { class: 'block text-sm font-medium text-slate-300 mb-2', text: field.label + (field.required ? ' *' : '') }));
      const group = el('div', { class: 'flex flex-wrap gap-2' });
      (field.options || []).forEach((opt, i) => {
        const optId = `${field.id}_${i}`;
        const optWrap = el('label', { for: optId, class: 'field-input flex items-center gap-2 rounded-lg px-3.5 py-2.5 text-sm text-slate-300 cursor-pointer' });
        optWrap.appendChild(el('input', { type: 'checkbox', id: optId, name: field.id, value: opt }));
        optWrap.appendChild(document.createTextNode(opt));
        group.appendChild(optWrap);
      });
      wrap.appendChild(group);
    } else {
      // text, email, tel, number, date, etc.
      wrap.appendChild(labelNode(field));
      wrap.appendChild(el('input', {
        type: field.type || 'text', id: field.id, name: field.id,
        placeholder: field.placeholder || '',
        class: 'field-input w-full rounded-lg px-4 py-3 text-sm text-white placeholder-slate-500',
        ...(field.required ? { required: 'required' } : {})
      }));
    }
    return wrap;
  }

  function collectCheckboxGroups(formData, config) {
    // Formsubmit erwartet eher flache Werte; Checkbox-Gruppen werden als kommagetrennte Liste zusammengefasst
    config.fields.filter(f => f.type === 'checkbox').forEach(f => {
      const values = formData.getAll(f.id);
      formData.delete(f.id);
      if (values.length) formData.set(f.id, values.join(', '));
    });
  }

  async function init() {
    let config;
    try {
      const res = await fetch(CONFIG_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('Konfiguration konnte nicht geladen werden (' + res.status + ')');
      config = await res.json();
    } catch (err) {
      els.loading.classList.add('hidden');
      els.error.classList.remove('hidden');
      els.error.textContent = 'Formular konnte nicht geladen werden: ' + err.message;
      return;
    }

    els.title.textContent = config.title || 'Bewerbung';
    els.description.textContent = config.description || '';
    els.subjectField.value = config.title ? ('Neue Bewerbung — ' + config.title) : 'Neue Bewerbung';
    els.submitBtn.textContent = config.submitLabel || 'Bewerbung absenden';
    els.successMessage.textContent = config.successMessage || 'Danke für deine Bewerbung!';

    (config.fields || []).forEach(field => {
      els.fields.appendChild(renderField(field));
    });

    els.loading.classList.add('hidden');
    els.form.classList.remove('hidden');

    els.form.addEventListener('submit', async (e) => {
      e.preventDefault();
      els.submitError.classList.add('hidden');
      els.submitBtn.disabled = true;
      els.submitBtn.textContent = 'Wird gesendet …';

      const formData = new FormData(els.form);
      collectCheckboxGroups(formData, config);
      const payload = Object.fromEntries(formData.entries());

      try {
        const res = await fetch(FORMSUBMIT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('Senden fehlgeschlagen (' + res.status + ')');

        els.form.classList.add('hidden');
        els.success.classList.remove('hidden');
      } catch (err) {
        els.submitError.textContent = 'Es gab ein Problem beim Senden: ' + err.message + '. Bitte versuche es erneut.';
        els.submitError.classList.remove('hidden');
        els.submitBtn.disabled = false;
        els.submitBtn.textContent = config.submitLabel || 'Bewerbung absenden';
      }
    });
  }

  init();

  // ============ Netzwerk-Hintergrund ============
  const canvas = document.getElementById('network-canvas');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, nodes;
  const NODE_COUNT = 34;
  const LINK_DIST = 150;

  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function initNodes() {
    nodes = Array.from({ length: NODE_COUNT }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.5) * 0.12,
    }));
  }
  initNodes();

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const n of nodes) {
      if (!reduceMotion) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > w) n.vx *= -1;
        if (n.y < 0 || n.y > h) n.vy *= -1;
      }
    }
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < LINK_DIST) {
          ctx.strokeStyle = `rgba(8,119,249,${(1 - dist / LINK_DIST) * 0.3})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
    }
    for (const n of nodes) {
      ctx.fillStyle = 'rgba(77,163,255,0.5)';
      ctx.beginPath(); ctx.arc(n.x, n.y, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  draw();
</script>

</body>
</html>
